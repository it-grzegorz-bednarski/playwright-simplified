<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample Performance Test Report</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
      .ok { color: #16a34a; }
      .fail { color: #dc2626; }
      table { border-collapse: collapse; margin-top: 16px; }
      th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
      th { background: #f8fafc; }
    </style>
  </head>
  <body>
    <h1>Sample Lighthouse Detailed Report</h1>
    <p>This is a representative detailed report file for documentation purposes.</p>
    <table>
      <thead>
        <tr>
          <th>Category</th>
          <th>Score</th>
          <th>Threshold</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>performance</td><td>58.0</td><td>40</td><td class="ok">OK</td></tr>
        <tr><td>accessibility</td><td>95.0</td><td>80</td><td class="ok">OK</td></tr>
        <tr><td>bestPractices</td><td>76.0</td><td>70</td><td class="ok">OK</td></tr>
        <tr><td>seo</td><td>91.0</td><td>90</td><td class="ok">OK</td></tr>
      </tbody>
    </table>
  </body>
</html>
